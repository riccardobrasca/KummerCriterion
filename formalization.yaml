# formalization.yaml (v0.1): repo-root metadata for formalization projects.
# [required] fields should be filled; everything else is optional.

# project - the formalization itself (not the source).
project:
  name: "flt-regular-bernoulli"
  authors:
    - "Chris Birkbeck"
    - "Riccardo Brasca"
  license: "Apache-2.0"

# sources - what was formalized. List of papers/textbooks/blueprints.
# title+authors required, others optional.
sources:
  - title: "Fermat's Last Theorem for regular primes" 
    authors:
      - "J. P. Diekmann"
    id: "Master's thesis, University Duisburg-Essen, 2023; local file docs/diekmann_2023_flt_regular_primes.pdf"
    type: "thesis"
  - title: "Introduction to Cyclotomic Fields"
    authors:
      - "Lawrence C. Washington"
    id: "local file docs/washington_cyclotomic_fields.pdf"
    type: "textbook"
  - title: "Note on irregular primes"
    authors:
      - "Leonard Carlitz"
    id: "Proc. Amer. Math. Soc. 5 (1954), 329-331"
    type: "paper"
  - title: "A Classical Introduction to Modern Number Theory"
    authors:
      - "Kenneth Ireland"
      - "Michael Rosen"
    id: "Graduate Texts in Mathematics 84, Springer"
    type: "textbook"

# how it was produced
automation:
  method: "agent"
  models:
    - "gpt-5"
    - "claude-opus-4.7"
  framework: "Codex CLI and Claude Code with Lean LSP tooling"
  cost:
    wall_time: "one month"
    api_spend_usd: "400"
    hardware: "our laptops"
  notes: "The Lean formalization work was carried out automatically by agents, with detailed human guidance on the mathematical strategy and decomposition. The main theorem is sorry-free and was verified with comparator." # freeform

# project status
status:
  sorry_count: 6
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"

# human review status
review:
  status: "author-verified"    # [required] unchecked | self-assessed | peer-reviewed | author-verified
  reviewers:
    - "Chris Birkbeck"
    - "Riccardo Brasca"

# alignment - freeform yaml: how source statements map to formal declarations.
# e.g. a blueprint link, or a per-statement table.
alignment:
  blueprint: "https://cbirkbeck.github.io/flt-regular-bernoulli/blueprint/"
