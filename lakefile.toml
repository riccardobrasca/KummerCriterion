name = "KummerCriterion"
defaultTargets = ["KummerCriterion", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
linter.mathlibStandardSet = true
linter.flexible = true
linter.style.header = false

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti.git"
rev = "ae590cc45dab074fb3ce5b25574d91e8d7d4ed87"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "1b1ccf4b088b32fa3f23f2de1127433254a81e1e"

[[require]]
name = "flt-regular"
git = "https://github.com/leanprover-community/flt-regular.git"
rev = "master"

[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
# Avoid blocking source-URI jobs: https://github.com/leanprover/doc-gen4/pull/435
rev = "438ef089bb15774edba9a21e158e9cd7acc67714"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
rev = "master"

[[lean_lib]]
name = "KummerCriterion"
globs = ["KummerCriterion"]

# Trusted challenge and solution-wrapper modules for leanprover/comparator.  `Challenge` imports
# only Mathlib; `Solution` imports this project and delegates to
# `KummerCriterion.fermatLastTheoremFor_le100_of_ne_irregular`.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
