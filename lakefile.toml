name = "«flt-regular-bernoulli»"
defaultTargets = ["BernoulliRegular"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
linter.mathlibStandardSet = true
linter.flexible = true
linter.style.header = false

[[require]]
name = "flt-regular"
git = "https://github.com/leanprover-community/flt-regular.git"
rev = "master"

[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "main"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
rev = "master"

[[lean_lib]]
name = "BernoulliRegular"
globs = ["BernoulliRegular"]
